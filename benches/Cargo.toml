[workspace]

[package]
name = "benches"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0+"

[dependencies]
async-trait = "0.1.89"
criterion = "0.5.1"
mtop-client = { path = "../mtop-client" }
tokio = { version = "1.14.0", features = ["full"] }

[[bench]]
name = "dns_name"
path = "dns_name.rs"
harness = false

[[bench]]
name = "client_core"
path = "client_core.rs"
harness = false

[[bench]]
name = "client_discovery"
path = "client_discovery.rs"
harness = false

[[bench]]
name = "client_codec"
path = "client_codec.rs"
harness = false

[profile.release]
lto = "fat"